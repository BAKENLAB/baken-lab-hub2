<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BAKEN LAB｜接続認証</title>
<style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;background:#090b0f;color:#f7f8fa}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px}.card{width:min(100%,460px);border:1px solid #252b35;border-radius:18px;background:#101319;padding:22px}.brand{color:#c8ff4d;font-size:12px;font-weight:900;letter-spacing:.12em}h1{font-size:22px;margin:8px 0}p{color:#aeb7c2;font-size:13px;line-height:1.65}.box{margin-top:16px;border:1px solid #252b35;border-radius:12px;padding:14px;background:#0c0f14}.row{margin:8px 0;font-size:12px;word-break:break-word}.muted{color:#8b95a3}.scope{display:inline-block;margin:3px 4px 0 0;border:1px solid #303744;border-radius:999px;padding:4px 7px;font-size:10px}label{display:block;margin-top:12px;color:#aeb7c2;font-size:11px;font-weight:800}input{width:100%;margin-top:5px;border:1px solid #303744;border-radius:10px;background:#090b0f;color:#fff;padding:12px}button{width:100%;border:0;border-radius:10px;padding:12px;margin-top:10px;font-weight:900}.primary{background:#c8ff4d;color:#111}.danger{background:transparent;border:1px solid #55343a;color:#ff9aa7}.error{margin-top:12px;color:#ff9aa7;font-size:12px;white-space:pre-wrap}.hidden{display:none!important}
</style></head><body><main class="card"><div class="brand">BAKEN LAB｜LAB HUB</div><h1>接続認証</h1><p id="lead">接続内容を確認しています。</p><div id="error" class="error hidden"></div>
<section id="login" class="hidden"><label>メールアドレス<input id="email" type="email" autocomplete="email"></label><label>パスワード<input id="password" type="password" autocomplete="current-password"></label><button id="signIn" class="primary">ログインして続ける</button><button id="forgot" class="danger">パスワードを忘れた方</button></section>
<section id="recovery" class="hidden"><p>登録メールにパスワード再設定リンクを送ります。</p><label>メールアドレス<input id="recoveryEmail" type="email" autocomplete="email"></label><button id="sendReset" class="primary">再設定メールを送る</button><button id="backLogin" class="danger">ログインに戻る</button></section>
<section id="newPassword" class="hidden"><p>新しいパスワードを設定してください。</p><label>新しいパスワード<input id="newPasswordValue" type="password" autocomplete="new-password" minlength="6"></label><label>もう一度入力<input id="newPasswordConfirm" type="password" autocomplete="new-password" minlength="6"></label><button id="savePassword" class="primary">新しいパスワードを保存</button></section>
<section id="consent" class="hidden"><div class="box"><div class="row"><span class="muted">接続元：</span><strong id="client"></strong></div><div class="row"><span class="muted">権限：</span><span id="scopes"></span></div></div><p>内容を確認して、接続を許可してください。</p><button id="allow" class="primary">接続を許可</button><button id="deny" class="danger">拒否</button></section></main>
<script type="module">
import{createClient}from"https://esm.sh/@supabase/supabase-js@2";
const supabase=createClient("https://qjlvsndiqjfsfjinilig.supabase.co","sb_publishable_HrB7-sXU5tg5AOjrwb2uJg_yrdXuzcN"),$=s=>document.querySelector(s),authorizationId=new URLSearchParams(location.search).get("authorization_id");
function fail(m){$("#error").textContent=m;$("#error").classList.remove("hidden");$("#lead").textContent="接続認証を完了できませんでした。"}
let recoveryMode=false;
supabase.auth.onAuthStateChange((event)=>{if(event==="PASSWORD_RECOVERY"){recoveryMode=true;["#login","#recovery","#consent"].forEach(s=>$(s)?.classList.add("hidden"));$("#error").classList.add("hidden");$("#lead").textContent="新しいパスワードを設定してください。";$("#newPassword").classList.remove("hidden")}});
async function load(){if(location.hash.includes("type=recovery"))recoveryMode=true;if(recoveryMode){$("#lead").textContent="再設定リンクを確認しています。";return}if(!authorizationId){fail("authorization_id がありません。ChatGPT側から接続を開始してください。");return}const{data:{user}}=await supabase.auth.getUser();if(!user){$("#lead").textContent="BAKEN LABのアカウントでログインしてください。";$("#login").classList.remove("hidden");return}const{data,error}=await supabase.auth.oauth.getAuthorizationDetails(authorizationId);if(error||!data){fail(error?.message||"認証リクエストを確認できません。");return}if(!("authorization_id"in data)){location.assign(data.redirect_url);return}$("#client").textContent=data.client?.name||"外部アプリ";const scopes=(data.scope||"").trim().split(/\s+/).filter(Boolean);$("#scopes").textContent="";if(scopes.length)for(const s of scopes){const e=document.createElement("span");e.className="scope";e.textContent=s;$("#scopes").appendChild(e)}else $("#scopes").textContent="標準アクセス";$("#lead").textContent="次のアプリが接続を求めています。";$("#consent").classList.remove("hidden")}
$("#forgot").onclick=()=>{$("#login").classList.add("hidden");$("#recovery").classList.remove("hidden");$("#recoveryEmail").value=$("#email").value;$("#lead").textContent="パスワードを再設定します。"};
$("#backLogin").onclick=()=>{$("#recovery").classList.add("hidden");$("#login").classList.remove("hidden");$("#lead").textContent="BAKEN LABのアカウントでログインしてください。"};
$("#sendReset").onclick=async()=>{const email=$("#recoveryEmail").value.trim();if(!email){fail("メールアドレスを入力してください。");return}const redirectTo=location.origin+location.pathname;const{error}=await supabase.auth.resetPasswordForEmail(email,{redirectTo});if(error){fail(error.message);return}$("#error").classList.add("hidden");$("#lead").textContent="再設定メールを送りました。メール内のリンクを開いてください。";$("#recovery").classList.add("hidden")};
$("#savePassword").onclick=async()=>{const p=$("#newPasswordValue").value,q=$("#newPasswordConfirm").value;if(p.length<6){fail("パスワードは6文字以上にしてください。");return}if(p!==q){fail("2回のパスワードが一致していません。");return}const{error}=await supabase.auth.updateUser({password:p});if(error){fail(error.message);return}$("#newPassword").classList.add("hidden");$("#lead").textContent="パスワードを変更しました。ChatGPTの接続画面に戻って、もう一度サインインしてください。";history.replaceState(null,"",location.pathname)};
$("#signIn").onclick=async()=>{const{error}=await supabase.auth.signInWithPassword({email:$("#email").value,password:$("#password").value});if(error){fail("ログインできませんでした。入力内容を確認してください。");return}location.reload()};
$("#allow").onclick=async()=>{const{data,error}=await supabase.auth.oauth.approveAuthorization(authorizationId);if(error){fail(error.message);return}location.assign(data.redirect_url)};
$("#deny").onclick=async()=>{const{data,error}=await supabase.auth.oauth.denyAuthorization(authorizationId);if(error){fail(error.message);return}location.assign(data.redirect_url)};
load().catch(e=>fail(e?.message||String(e)));
</script></body></html>

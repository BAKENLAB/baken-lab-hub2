name: JRA JUMP official source smoke
on:
  push:
    branches: [research/jra-jump-01-hub-integration]
    paths: ['automation/jra-jump-official-day-audit.mjs','automation/jra-jump-official-smoke.mjs','automation/jra-jump-program-reader.mjs','automation/jra-jump-official-history.mjs','.github/workflows/jra-jump-source-smoke.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  official-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare isolated parser dependency
        run: |
          mkdir -p "$RUNNER_TEMP/jump-smoke"
          npm install --prefix "$RUNNER_TEMP/jump-smoke" --ignore-scripts --no-audit --no-fund --save-exact cheerio@1.0.0
          cp automation/jra-jump-official-smoke.mjs automation/jra-jump-program-reader.mjs automation/jra-jump-official-history.mjs automation/jra-jump-official-day-audit.mjs automation/jra-jump-verified-cache.mjs "$RUNNER_TEMP/jump-smoke/"
          sed -i "s|npm:cheerio@1.0.0|cheerio|" "$RUNNER_TEMP/jump-smoke/jra-jump-official-smoke.mjs"
      - name: Historical official program and one result only
        run: |
          cd "$RUNNER_TEMP/jump-smoke"
          env -i PATH="$PATH" HOME="$RUNNER_TEMP" node jra-jump-official-smoke.mjs

      - name: Single previous day completeness audit
        run: |
          cd "$RUNNER_TEMP/jump-smoke"
          env -i PATH="$PATH" HOME="$RUNNER_TEMP" node jra-jump-official-day-audit.mjs

      - name: Retain verified historical sample only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jump-official-evidence
          path: ${{ runner.temp }}/jump-smoke/jump-evidence/
          if-no-files-found: warn
          retention-days: 14

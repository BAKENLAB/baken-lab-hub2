name: BAKEN LAB evidence research checks
on:
  push:
    branches:
      - feature/pace-evidence-prereace-gate
  pull_request:
    paths:
      - "research/*.mjs"
      - "package.json"
      - ".github/workflows/evidence-research.yml"
permissions:
  contents: read
jobs:
  evidence-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify evidence prefetch and safety
        run: npm run test:pace
      - name: Syntax check staged LOCAL context v14 and research v15 (v15 not deployed)
        run: |
          node --check research/staged-lab-claimed-context-handler-v14.mjs
          node --check research/staged-lab-claimed-context-handler-v15.mjs
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Verify NAR official result HTML extraction (Deno/Cheerio)
        run: deno test --allow-env research/nar-prior-corners-dom.test.ts
      - name: Typecheck the fully bundled dormant LOCAL preclaim Edge runtime
        run: |
          mkdir -p .edge-preclaim-ci
          cp research/staged-local-preclaim-edge-index.ts .edge-preclaim-ci/index.ts
          cp -R automation .edge-preclaim-ci/automation
          deno check .edge-preclaim-ci/index.ts
      # The three one-day current-race NAR canaries already passed on 2026-11-08.
      # Retired from each push to avoid repeatedly hitting public official servers.
      # Test source and immutable successful CI logs remain available for audit.
      # Completed one-off real JRA historical lap test: CI 42438541291.
      # Retired from every push to avoid repeated public JRA fetches.
      - name: Probe completed NAR official archive (non-blocking external reachability check)
        continue-on-error: true
        timeout-minutes: 1
        run: deno test --allow-env --allow-net=www.keiba.go.jp research/nar-official-archive-live.test.ts

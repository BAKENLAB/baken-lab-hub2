name: Automation reliability PostgreSQL test

on:
  push:
    branches:
      - test/automation-reliability-v1-db

permissions:
  contents: read

jobs:
  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply reviewed patch
        run: |
          set -euo pipefail
          git apply --check automation-reliability-v1-review2.patch
          git apply automation-reliability-v1-review2.patch
          # Temporary CI-only correction: libpq treats PGSERVICE='' as an explicit
          # empty service name. The reviewed test harness intended to disable
          # service lookup, so remove only that empty variable here.
          python - <<'PY'
          from pathlib import Path
          p=Path("tests/automation-queue.test.mjs")
          s=p.read_text()
          old="PGOPTIONS: '', PGSERVICE: '', PGSERVICEFILE: '/dev/null'"
          new="PGOPTIONS: '', PGSERVICEFILE: '/dev/null'"
          if old not in s:
              raise SystemExit("expected PGSERVICE test-harness line not found")
          p.write_text(s.replace(old,new,1))
          PY

      - name: Install PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql postgresql-client

      - name: Start disposable PostgreSQL cluster
        shell: bash
        run: |
          set -euo pipefail
          PGBIN="$(pg_config --bindir)"
          SOCK="$RUNNER_TEMP/lab-queue-pg"
          DATA="$RUNNER_TEMP/lab-queue-data"
          mkdir -p "$SOCK" "$DATA"
          "$PGBIN/initdb" -D "$DATA" -A trust --no-locale
          "$PGBIN/pg_ctl" -D "$DATA" -o "-k $SOCK -p 55432 -c listen_addresses=''" -w start
          echo "LAB_QUEUE_TEST_DISPOSABLE=YES" >> "$GITHUB_ENV"
          echo "LAB_QUEUE_TEST_SOCKET=$SOCK" >> "$GITHUB_ENV"
          echo "LAB_QUEUE_TEST_PORT=55432" >> "$GITHUB_ENV"
          echo "LAB_QUEUE_TEST_USER=$(whoami)" >> "$GITHUB_ENV"

      - name: Run 40 PostgreSQL queue tests
        run: node --test tests/automation-queue.test.mjs

      - name: Run existing reliability tests
        run: node tests/reliability.test.mjs

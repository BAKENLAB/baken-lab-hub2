name: Work38 isolated native evidence replay
on:
  pull_request:
    branches:
      - research/reborn2-chatgpt-33-100-20261126
    paths:
      - 'research/reborn2-work38/**'
      - '.github/workflows/reborn2-work38-native.yml'
permissions:
  contents: read
jobs:
  work38-research-only:
    if: github.event.pull_request.head.ref == 'research/reborn2-work38-native-20261128' && github.event.pull_request.base.ref == 'research/reborn2-chatgpt-33-100-20261126'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify evidence and execute pinned common decision
        env:
          WORK38_RECEIPT: ${{ runner.temp }}/work38-receipt.json
        run: node research/reborn2-work38/native-replay.mjs
      - name: Preserve research receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: work38-native-receipt
          path: ${{ runner.temp }}/work38-receipt.json
          if-no-files-found: warn
          retention-days: 3

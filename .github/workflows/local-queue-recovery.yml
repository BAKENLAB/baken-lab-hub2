name: LOCAL queue recovery regression
on:
  push:
    branches: [fix/local-queue-expired-recovery-20261013]
  workflow_dispatch:
jobs:
  queue-recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regression test
        run: node --test automation/queue-operation-recovery.test.mjs

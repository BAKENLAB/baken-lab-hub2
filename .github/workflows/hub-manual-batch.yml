name: HUB manual batch free handoff tests
on:
  push:
    branches:
      - feature/hub-manual-batch-20261022
    paths:
      - '.github/workflows/hub-manual-batch.yml'
jobs:
  manual-batch-check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test safe all-venue selection
        run: node --test automation/hub-manual-batch.test.mjs
      - name: Verify UI contract and no paid execution path
        run: |
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const page=fs.readFileSync('today.html','utf8');
          const home=fs.readFileSync('index.html','utf8');
          assert.match(page,/id="manualBatchBtn"/);
          assert.match(page,/manual-batch\.js/);
          assert.match(page,/api\(\{action:'list',date\}\)/);
          assert.match(page,/BAKENManualBatch\.selectEligible/);
          assert.match(page,/https:\/\/chatgpt\.com\/\?q=/);
          assert.match(home,/today\.html#manual-batch/);
          const inline=[...page.matchAll(/<script>([\s\S]*?)<\/script>/g)];
          for(const [,js] of inline)new Function(js);
          console.log('UI_INVARIANTS_OK',inline.length);
          JS

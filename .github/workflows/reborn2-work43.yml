name: Work43 offline evidence research
on:
  pull_request:
    branches: [research/reborn2-work42-final-supply-20261128]
    paths:
      - 'research/reborn2-work43/**'
      - '.github/workflows/reborn2-work43.yml'
permissions:
  contents: read
jobs:
  offline:
    if: github.event.pull_request.head.ref == 'research/reborn2-work43-official-intake-20261128'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Work43 local synthetic custody and official-format projection
        env:
          WORK43_RECEIPT: ${{ runner.temp }}/work43-receipt.json
        run: node research/reborn2-work43/test-offline-intake.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: work43-receipt
          path: ${{ runner.temp }}/work43-receipt.json
          if-no-files-found: warn
          retention-days: 7

name: REBORN2 Codex02 isolated implementation
on:
  push:
    branches: [implementation/reborn2-pilot-01-20261128]
permissions:
  contents: read
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node implementation/reborn2-pilot/test-v2.mjs
        env:
          PILOT_ARTIFACT_DIR: ${{ runner.temp }}/reborn2-preview
      - run: node implementation/reborn2-pilot/test-mobile-browser.mjs
        env:
          PILOT_ARTIFACT_DIR: ${{ runner.temp }}/reborn2-preview
      - uses: actions/upload-artifact@v4
        with:
          name: reborn2-codex02-list-preview
          path: ${{ runner.temp }}/reborn2-preview/
          retention-days: 7

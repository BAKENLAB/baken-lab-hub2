name: JRA one-shot credential capability probe 2026-11-21
on:
  push:
    branches: [fix/jra-manual-bootstrap-20261121]
    paths: ['.github/workflows/jra-one-shot-credential-probe-20261121.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      JRA_CRON_TOKEN: ${{ secrets.JRA_CRON_TOKEN }}
    steps:
      - name: Check availability of existing authorized credential; no network, no mutation
        shell: bash
        run: |
          if [ -n "$JRA_CRON_TOKEN" ]; then
            echo "JRA_CREDENTIAL_AVAILABLE=true"
          else
            echo "JRA_CREDENTIAL_AVAILABLE=false"
          fi

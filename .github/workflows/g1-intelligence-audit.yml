name: JRA G1 Intelligence read-only audit
on:
  push:
    paths:
      - 'supabase/functions/jra-claimed-mcp/g1-intelligence-audit.mjs'
      - 'research/g1-intelligence/**'
      - '.github/workflows/g1-intelligence-audit.yml'
  pull_request:
    paths:
      - 'supabase/functions/jra-claimed-mcp/g1-intelligence-audit.mjs'
      - 'research/g1-intelligence/**'
      - '.github/workflows/g1-intelligence-audit.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run read-only G1 coverage tests
        run: node --test research/g1-intelligence/g1-intelligence-audit.test.mjs

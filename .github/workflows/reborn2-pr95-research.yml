name: REBORN 2 PR95 isolated integration
on:
  push:
    branches: [research/reborn2-independent-engine-20261128]
permissions:
  contents: read
jobs:
  common:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: bash research/reborn2-chatgpt-circuit/run-node-regression.sh
      - run: node research/reborn2-chatgpt-circuit/test-v42-eye-intervention.mjs
      - run: node research/reborn2-independent-engine/main47-integration/test-work40-common.mjs
  work39:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/checkout@v4
        with:
          ref: 9c8401e9735f102a3d25c49aef524681a29d7b2d
          path: fixed-work39
          persist-credentials: false
      - name: Apply only the roster correction and execute fixed replays
        working-directory: fixed-work39
        env:
          WORK38_RECEIPT: ${{ runner.temp }}/work38-receipt.json
        run: |
          patch="$GITHUB_WORKSPACE/research/reborn2-independent-engine/main47-integration/v42-research.patch"
          git apply --check --include=research/reborn2-chatgpt-circuit/work35-v38-completion.mjs "$patch"
          git apply --include=research/reborn2-chatgpt-circuit/work35-v38-completion.mjs "$patch"
          node research/reborn2-work38/native-replay.mjs
          node research/reborn2-work39/native-replay.mjs

  v43-generic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node research/reborn2-independent-engine/main47-integration/test-v43-generic.mjs

  v44-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node research/reborn2-independent-engine/main47-integration/test-v44-integration.mjs

  v45-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node research/reborn2-independent-engine/main47-integration/test-v45-integration.mjs
  work42-fixed:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1f185f879bc58ca5d0665d90419981dac9b73bf6
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node research/reborn2-work41-corrected/test-v0.3.mjs
      - uses: actions/checkout@v4
        with:
          ref: de895a633ec098a28b9014065231dd54d3ec6f89
          path: pinned-v43
          persist-credentials: false
      - run: node research/reborn2-work42/test-v0.4.mjs
        env:
          V43_ROOT: ${{ github.workspace }}/pinned-v43

  v46-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node research/reborn2-independent-engine/main47-integration/test-v46-integration.mjs

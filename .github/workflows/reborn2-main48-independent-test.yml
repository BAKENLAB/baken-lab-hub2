name: REBORN2 Main48 independent diagnostics
on:
  pull_request:
    branches: [research/reborn2-main48-test-ci-base]
permissions:
  contents: read
jobs:
  independent:
    if: github.head_ref == 'research/reborn2-independent-main48-final-test' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact checkout and revised six probes
        shell: bash
        run: |
          git rev-parse HEAD
          node --version
          set +e
          node research/reborn2-independent-tests/probe-main48-revised.mjs > "$RUNNER_TEMP/main48-revised.log" 2>&1
          rc=$?
          cat "$RUNNER_TEMP/main48-revised.log"
          echo "REVISED_EXIT=$rc"
          exit "$rc"
      - name: Trace known-active pairs through upstream and V42
        if: always()
        shell: bash
        run: |
          set +e
          node research/reborn2-independent-tests/trace-fk34-unknown.mjs > "$RUNNER_TEMP/main48-trace.log" 2>&1
          rc=$?
          cat "$RUNNER_TEMP/main48-trace.log"
          echo "TRACE_EXIT=$rc"
          exit "$rc"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: main48-revised-and-trace
          path: |
            ${{ runner.temp }}/main48-revised.log
            ${{ runner.temp }}/main48-trace.log

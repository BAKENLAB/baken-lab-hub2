name: REBORN2 NORMAL Test06 independent
on:
  pull_request:
    branches: [research/reborn2-main48-test-ci-base]
permissions:
  contents: read
jobs:
  work11-retry:
    if: github.head_ref == 'research/reborn2-independent-main48-final-test' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/checkout@v4
        with:
          ref: 53af067a92f0e366bcd7d3b568a9561bf373f7bb
          path: fixed-codex11
          fetch-depth: 0
          persist-credentials: false
      - name: Test06 work11-retry fixed independent
        shell: bash
        run: |
          git rev-parse HEAD
          node --version
          set +e
          node --max-old-space-size=4096 research/reborn2-independent-tests/probe-normal-test06-work11-retry.mjs fixed-codex11 53af067a92f0e366bcd7d3b568a9561bf373f7bb > "$RUNNER_TEMP/work11-retry.log" 2>&1
          rc=$?
          cat "$RUNNER_TEMP/work11-retry.log"
          echo "TEST06_EXIT=$rc"
          exit "$rc"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reborn2-test06-work11-retry
          path: ${{ runner.temp }}/work11-retry.log

name: REBORN2 Main48 independent diagnostics
on:
  pull_request:
    branches: [research/reborn2-main48-test-ci-base]
permissions:
  contents: read
jobs:
  independent:
    if: github.head_ref == 'research/reborn2-independent-main48-final-test' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/checkout@v4
        with:
          ref: a00aebc72182bd3ecd1a1b47356d3ddf75b80065
          path: fixed-v46
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 1f185f879bc58ca5d0665d90419981dac9b73bf6
          path: fixed-work42
          persist-credentials: false
      - name: Execute unchanged prepared six independent diagnostics
        shell: bash
        run: |
          git rev-parse HEAD
          node --version
          set +e
          node research/reborn2-independent-tests/probe-v44-prepared.mjs fixed-v46 a00aebc72182bd3ecd1a1b47356d3ddf75b80065 fixed-work42 1f185f879bc58ca5d0665d90419981dac9b73bf6 > "$RUNNER_TEMP/v44-prepared.log" 2>&1
          rc=$?
          cat "$RUNNER_TEMP/v44-prepared.log"
          echo "PREPARED_EXIT=$rc"
          exit "$rc"
      - name: Retest IT48-07 and cancellation contrast
        if: always()
        shell: bash
        run: |
          set +e
          node research/reborn2-independent-tests/probe-v44-supplement.mjs fixed-v46 a00aebc72182bd3ecd1a1b47356d3ddf75b80065 > "$RUNNER_TEMP/v44-supplement.log" 2>&1
          rc=$?
          cat "$RUNNER_TEMP/v44-supplement.log"
          echo "SUPPLEMENT_EXIT=$rc"
          exit "$rc"
      - name: V45 independent semantic and peer interventions
        if: always()
        shell: bash
        run: |
          set +e
          node research/reborn2-independent-tests/probe-v45-independent.mjs fixed-v46 a00aebc72182bd3ecd1a1b47356d3ddf75b80065 > "$RUNNER_TEMP/v45-independent.log" 2>&1
          rc=$?
          cat "$RUNNER_TEMP/v45-independent.log"
          echo "V45_EXIT=$rc"
          exit "$rc"
      - name: V46 independent category and grade boundary controls
        if: always()
        shell: bash
        run: |
          set +e
          node research/reborn2-independent-tests/probe-v46-independent.mjs fixed-v46 a00aebc72182bd3ecd1a1b47356d3ddf75b80065 > "$RUNNER_TEMP/v46-independent.log" 2>&1
          rc=$?
          cat "$RUNNER_TEMP/v46-independent.log"
          echo "V46_EXIT=$rc"
          exit "$rc"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: main48-v46-independent
          path: |
            ${{ runner.temp }}/v44-prepared.log
            ${{ runner.temp }}/v44-supplement.log
            ${{ runner.temp }}/v45-independent.log
            ${{ runner.temp }}/v46-independent.log

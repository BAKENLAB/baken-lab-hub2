name: REBORN2 practical Test02 isolated browser retry
on:
  pull_request:
    branches: [research/reborn2-main48-test-ci-base]
permissions:
  contents: read
jobs:
  browser:
    if: github.head_ref == 'research/reborn2-independent-main48-final-test' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/checkout@v4
        with:
          ref: 3b11bc964f96859893d890351761510f23e9abe9
          path: fixed-codex03
          fetch-depth: 0
          persist-credentials: false
      - name: Test02 independent isolated browser retry
        shell: bash
        run: |
          set +e
          node --max-old-space-size=4096 research/reborn2-independent-tests/probe-practical-test02-browser-retry.mjs fixed-codex03 3b11bc964f96859893d890351761510f23e9abe9 > "$RUNNER_TEMP/browser.log" 2>&1
          rc=$?
          cat "$RUNNER_TEMP/browser.log"
          echo "TEST02_BROWSER_EXIT=$rc"
          exit "$rc"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reborn2-test02-browser-retry
          path: ${{ runner.temp }}/browser.log

name: REBORN2 Main48 independent diagnostics
on:
  pull_request:
    branches: [research/reborn2-main48-test-ci-base]
permissions:
  contents: read
jobs:
  independent:
    if: github.head_ref == 'research/reborn2-independent-main48-final-test' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/checkout@v4
        with:
          ref: ba4d85bb248e810969ddc321d9d7485474a38d10
          path: fixed-v43
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 2d7e9e59706acb749b7b5b7e13be5c3be16f5469
          path: fixed-work41
          persist-credentials: false
      - name: Independently verify fixed V43 and corrected Work41
        shell: bash
        run: |
          git rev-parse HEAD
          node --version
          set +e
          node research/reborn2-independent-tests/probe-final-integration.mjs fixed-v43 ba4d85bb248e810969ddc321d9d7485474a38d10 fixed-work41 2d7e9e59706acb749b7b5b7e13be5c3be16f5469 > "$RUNNER_TEMP/main48-final.log" 2>&1
          rc=$?
          cat "$RUNNER_TEMP/main48-final.log"
          echo "FINAL_EXIT=$rc"
          exit "$rc"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: main48-final-fixed-v43-work41
          path: ${{ runner.temp }}/main48-final.log

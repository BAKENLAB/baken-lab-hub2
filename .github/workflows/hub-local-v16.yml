name: HUB LOCAL v16 display contract
on:
  push:
    branches: [fix/hub-support-local-eye-v16-20261013]
  pull_request:
    paths:
      - 'automation/hub-prediction-contract.mjs'
      - 'automation/hub-local-v16.test.mjs'
      - '.github/workflows/hub-local-v16.yml'
jobs:
  display-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test automation/hub-local-v16.test.mjs automation/hub-partial-visibility.test.mjs

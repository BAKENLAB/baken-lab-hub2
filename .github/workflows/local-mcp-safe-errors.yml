name: LOCAL MCP safe validation errors
on:
  push:
    branches: [fix/local-save-diagnostic-codes-20261013]
    paths:
      - 'automation/local-queue-operation.mjs'
      - 'automation/local-queue-error.test.mjs'
      - '.github/workflows/local-mcp-safe-errors.yml'
  pull_request:
    paths:
      - 'automation/local-queue-operation.mjs'
      - 'automation/local-queue-error.test.mjs'
      - '.github/workflows/local-mcp-safe-errors.yml'
jobs:
  safe-errors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test error mapping and secrecy
        run: node --test automation/local-queue-error.test.mjs

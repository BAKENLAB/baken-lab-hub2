name: LOCAL official laps, source and cutoff
on:
  pull_request:
    paths:
      - 'automation/nar-official-lap-evidence.*'
      - 'automation/local-lap-claimed-bridge.*'
      - 'automation/local-corner-snapshot-handoff.mjs'
      - 'automation/local-field-content-facts.mjs'
      - 'automation/local16-live-scoring-criteria.mjs'
      - 'supabase/functions/lab-local-corner-preclaim/**'
      - 'supabase/functions/lab-claimed-context/**'
      - '.github/workflows/local-official-laps-regression.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Official as-of prior race lap and horse-link tests
        run: node --test automation/nar-official-lap-evidence.test.mjs automation/local-lap-claimed-bridge.test.mjs
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Official HTML lap extraction and ambiguity rejection
        run: deno test --allow-net supabase/functions/lab-local-corner-preclaim/automation/nar-prior-corners-official-source.test.mjs

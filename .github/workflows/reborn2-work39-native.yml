name: Work39 isolated native evidence replay
on:
  pull_request:
    branches:
      - research/reborn2-chatgpt-33-100-20261126
    paths:
      - 'research/reborn2-work39/**'
      - '.github/workflows/reborn2-work39-native.yml'
permissions:
  contents: read
jobs:
  work39-research-only:
    if: github.event.pull_request.head.ref == 'research/reborn2-work39-native-20261128' && github.event.pull_request.base.ref == 'research/reborn2-chatgpt-33-100-20261126'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reproduce Work38 fixed receipt
        env:
          WORK38_RECEIPT: ${{ runner.temp }}/work38-receipt.json
        run: node research/reborn2-work38/native-replay.mjs
      - name: Work39 controlled evidence replay
        env:
          WORK38_RECEIPT: ${{ runner.temp }}/work38-receipt.json
          WORK39_RECEIPT: ${{ runner.temp }}/work39-receipt.json
        run: node research/reborn2-work39/native-replay.mjs
      - name: Preserve both receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: work39-native-receipts
          path: |
            ${{ runner.temp }}/work38-receipt.json
            ${{ runner.temp }}/work39-receipt.json
          if-no-files-found: warn
          retention-days: 3

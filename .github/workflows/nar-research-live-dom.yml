name: RESEARCH ONLY NAR pre-race HTML smoke test
# One bounded official GET per fixture; rerun with full ten-runner passage coverage.
on:
  push:
    branches:
      - research/local-corner-history-verification-20261022
    paths:
      - '.github/workflows/nar-research-live-dom.yml'
jobs:
  live-html-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install parser dependency
        run: npm install --no-save --package-lock=false --ignore-scripts cheerio@1.0.0
      - name: Verify published Kasamatsu 2026-08-14 11R card
        run: node automation/nar-deba-live-html-diagnostic.mjs
      - name: Verify missed 2026-10-21 winner's official pre-race card
        run: node automation/nar-deba-live-kasamatsu-20261021.mjs

name: HUB JRA public API read-only audit
on:
  push:
    branches: ['test/hub-jra-list-readonly-20261013']
    paths: ['.github/workflows/hub-jra-public-readonly.yml']
permissions:
  contents: read
jobs:
  readonly-list:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: GET public list endpoint and print only summary
        run: |
          python - <<'PY'
          import json, urllib.request, urllib.parse, urllib.error
          endpoint = "https://qjlvsndiqjfsfjinilig.supabase.co/functions/v1/hub2-api"
          for date in ("2026-10-11","2026-10-12"):
              url = endpoint + "?" + urllib.parse.urlencode({"action":"list","date":date})
              try:
                  req = urllib.request.Request(url, headers={"Accept":"application/json","User-Agent":"BAKEN-LAB-READONLY-DIAGNOSTIC/1"})
                  with urllib.request.urlopen(req, timeout=20) as res:
                      body = res.read()
                      code = res.status
                  data = json.loads(body)
                  predictions = data.get("predictions") or []
                  races = data.get("races") or []
                  jra_p = [r for r in predictions if r.get("circuit")=="JRA"]
                  jra_r = [r for r in races if r.get("circuit")=="JRA"]
                  errors = [(r.get("track"),r.get("race_no"),str(r.get("data_error"))[:180]) for r in jra_r if r.get("data_error") or r.get("prediction_status")=="DATA_ERROR"]
                  print("RESULT",json.dumps({"date":date,"http":code,"ok":data.get("ok"),"error":data.get("error"),"bytes":len(body),"jra_predictions":len(jra_p),"jra_races":len(jra_r),"jra_frozen":sum(r.get("prediction_status")=="FROZEN" and r.get("prediction") is not None for r in jra_r),"jra_data_errors":errors,"counts":data.get("counts")},ensure_ascii=False))
              except urllib.error.HTTPError as e:
                  print("HTTP_ERROR",json.dumps({"date":date,"status":e.code,"message":e.reason}))
              except Exception as e:
                  print("FETCH_ERROR",json.dumps({"date":date,"error_type":type(e).__name__,"error":str(e)[:230]}))
          PY

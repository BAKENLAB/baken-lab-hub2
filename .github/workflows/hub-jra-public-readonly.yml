name: HUB JRA live front-end read-only audit
on:
  push:
    branches: ['test/hub-jra-list-readonly-20261013']
    paths: ['.github/workflows/hub-jra-public-readonly.yml']
permissions:
  contents: read
jobs:
  static-frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Compare live HTML and service worker with public GitHub main without running JS
        run: |
          python - <<'PY'
          import urllib.request, urllib.error, hashlib, json
          base = "https://baken-lab.vercel.app"
          gh = "https://raw.githubusercontent.com/BAKENLAB/baken-lab-hub2/main"
          for path in ("/today.html", "/sw.js"):
              record={"file":path}
              try:
                  def get(url):
                      req=urllib.request.Request(url,headers={"User-Agent":"BAKEN-LAB-READONLY-DIAGNOSTIC/1","Accept":"text/html,*/*"})
                      with urllib.request.urlopen(req,timeout=20) as res:
                          return res.status,res.read()
                  prod_status,live=get(base+path)
                  src_status,main=get(gh+path)
                  record.update({"live_http":prod_status,"main_http":src_status,
                                 "live_bytes":len(live),"main_bytes":len(main),
                                 "matches_main":hashlib.sha256(live).digest()==hashlib.sha256(main).digest()})
                  if path=="/today.html":
                      s=live.decode("utf-8","replace")
                      record.update({"has_date_selector":'id="dateInput"' in s,
                                     "has_JRA_button":'data-circuit="JRA"' in s,
                                     "has_list_request":"action:'list'" in s,
                                     "has_today_default":"$('#dateInput').value=today" in s})
              except Exception as e:
                  record["error"]=type(e).__name__+": "+str(e)[:180]
              print("STATIC_CHECK",json.dumps(record,ensure_ascii=False))
          PY

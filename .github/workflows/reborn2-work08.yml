name: REBORN2 Work08 source integration
on:
  pull_request:
    branches: [implementation/reborn2-pilot-01-20261128]
    paths:
      - 'implementation/reborn2-work08/**'
      - '.github/workflows/reborn2-work08.yml'
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: git diff --exit-code f565e88af3404c84328a6cd035d2f21df3ea49dc -- research
      - run: node --check implementation/reborn2-work08/offline-converter.mjs
      - run: node implementation/reborn2-pilot/test-codex06.mjs
      - run: node implementation/reborn2-work08/test-integrated.mjs

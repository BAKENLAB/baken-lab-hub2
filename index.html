<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#080a0d" />
  <title>BAKEN LAB｜馬券ラボ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
:root {
  --bg: #080a0d;
  --panel: #10141a;
  --panel2: #151a22;
  --line: #252c37;
  --text: #f6f8fb;
  --muted: #8e98a7;
  --accent: #b8ff39;
  --accent2: #7cf4d1;
  --danger: #ff6b7d;
  --gold: #ffcf4a;
  --shadow: 0 18px 48px rgba(0,0,0,.32);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:"Noto Sans JP",system-ui,sans-serif}
body{background:radial-gradient(circle at top right,rgba(184,255,57,.08),transparent 28rem),var(--bg)}
button,input{font:inherit}
button{cursor:pointer}
.app-shell{width:min(100%,920px);margin:0 auto;padding:18px 14px 42px}
.topbar{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;padding:8px 2px 16px}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:.18em;color:var(--accent)}
h1{font-size:29px;line-height:1.2;margin:5px 0 0;font-weight:800;letter-spacing:-.03em}
.brain-badge{margin-top:3px;display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:#0d1117;border-radius:999px;padding:8px 11px;font-size:11px;font-weight:700;color:#dce3ec;white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px rgba(184,255,57,.9)}
.update-card{border:1px solid var(--line);background:linear-gradient(180deg,#10151c,#0c1015);padding:12px 14px;border-radius:12px;color:#c7d1dc;font-size:11px}
.update-head{display:flex;align-items:center;gap:9px;margin-bottom:6px}.update-label{color:var(--accent);font-size:10px;font-weight:900;letter-spacing:.12em}.update-date{color:#788494;font-size:10px;font-weight:700}.update-text{line-height:1.65;color:#cbd4de}
.tabs{display:grid;grid-template-columns:1fr 1fr;margin:18px 0 14px;border-bottom:1px solid var(--line)}
.tab{border:0;background:transparent;color:#6f7a89;padding:12px;font-weight:800;letter-spacing:.08em;border-bottom:2px solid transparent}
.tab.active{color:#fff;border-bottom-color:var(--accent)}
.panel{display:none}.panel.active{display:block}
.toolbar{display:flex;align-items:end;justify-content:space-between;gap:10px;margin:12px 0 14px}
.field-label{display:grid;gap:6px;font-size:9px;letter-spacing:.12em;color:var(--muted);font-weight:800}
input[type=date]{color-scheme:dark;background:var(--panel);color:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 10px;min-height:40px}
.segmented{display:flex;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:3px}
.seg{border:0;background:transparent;color:var(--muted);padding:8px 10px;border-radius:7px;font-size:11px;font-weight:700}
.seg.active{background:#222a35;color:#fff}
.status-card{border:1px dashed var(--line);background:rgba(255,255,255,.015);border-radius:12px;padding:13px;color:var(--muted);font-size:12px;margin-bottom:12px}
.race-list{display:grid;gap:9px}
.race-card{width:100%;text-align:left;border:1px solid var(--line);background:linear-gradient(180deg,#121720,#0e1218);border-radius:14px;padding:14px;color:#fff;box-shadow:0 10px 28px rgba(0,0,0,.14)}
.race-card:active{transform:scale(.995)}
.race-line{display:flex;align-items:center;justify-content:space-between;gap:10px}
.race-id{display:flex;align-items:center;gap:9px}
.circuit-chip{font-size:9px;font-weight:900;letter-spacing:.06em;border:1px solid var(--line);padding:4px 6px;border-radius:7px;color:var(--accent2)}
.race-no{font-size:17px;font-weight:900}.race-name{font-size:12px;color:#b8c1cc;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.race-meta{font-size:10px;color:#6f7a89;text-align:right}.frozen{color:var(--accent);font-weight:800}
.prediction-detail{margin-top:15px;border:1px solid var(--line);background:var(--panel);border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}
.hidden{display:none!important}
.detail-head{padding:16px;background:linear-gradient(140deg,rgba(184,255,57,.09),rgba(124,244,209,.03));border-bottom:1px solid var(--line)}
.detail-kicker{font-size:10px;color:var(--accent);font-weight:900;letter-spacing:.12em}.detail-title{font-size:19px;font-weight:900;margin-top:4px}.detail-sub{font-size:11px;color:var(--muted);margin-top:4px}.jump-bet{display:inline-flex;align-items:center;justify-content:center;margin-top:12px;min-height:40px;padding:0 14px;border-radius:10px;border:1px solid rgba(184,255,57,.32);background:rgba(184,255,57,.10);color:var(--accent);font-size:12px;font-weight:900;text-decoration:none;letter-spacing:.04em}.jump-bet:active{transform:scale(.985)}
.section{padding:15px;border-bottom:1px solid var(--line)}.section:last-child{border-bottom:0}.section-title{font-size:10px;font-weight:900;letter-spacing:.12em;color:#727e8f;margin-bottom:10px}
.eye-card{border:1px solid rgba(255,207,74,.34);background:linear-gradient(135deg,rgba(255,207,74,.10),rgba(255,107,125,.04));border-radius:15px;padding:14px}.eye-label{font-size:10px;color:var(--gold);font-weight:900;letter-spacing:.12em}.eye-main{display:grid;grid-template-columns:48px 1fr auto;gap:10px;align-items:center;margin-top:8px}.eye-name{font-size:17px;font-weight:900}.eye-reason{font-size:11px;color:#bdc6d0;line-height:1.6;margin-top:8px}.helmet{position:relative;width:42px;height:34px;border-radius:22px 22px 11px 11px;display:grid;place-items:center;font-weight:900;font-size:14px;border:2px solid rgba(255,255,255,.16);box-shadow:inset 0 -6px 0 rgba(0,0,0,.16)}.helmet:after{content:"";position:absolute;right:-5px;bottom:3px;width:13px;height:5px;border-radius:0 5px 5px 0;background:rgba(255,255,255,.42)}.helmet.light{color:#111}.helmet.dark{color:#fff}.helmet-n1{background:#f5f5f5}.helmet-n2{background:#20242b}.helmet-n3{background:#e74a4a}.helmet-n4{background:#3e7be6}.helmet-n5{background:#f0cf3a}.helmet-n6{background:#43a65b}.helmet-n7{background:#ec8b2d}.helmet-n8{background:#e889b2}.runner-table{display:grid;gap:7px}.runner{display:grid;grid-template-columns:48px 1fr auto;gap:10px;align-items:center;background:#0f1319;border:1px solid #1f2630;padding:10px;border-radius:12px}.runner-center{min-width:0}.runner-line{display:flex;align-items:center;gap:7px;min-width:0}.runner-name{font-size:13px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.runner-comment{font-size:10px;color:var(--muted);margin-top:4px;line-height:1.45}.runner-right{display:grid;justify-items:end;gap:5px}.market{font-size:10px;color:#aeb8c5;white-space:nowrap}.market strong{color:#fff;font-size:12px}.grade{display:grid;place-items:center;min-width:34px;height:28px;border-radius:8px;padding:0 8px;font-weight:900;font-size:12px;border:1px solid rgba(255,255,255,.10)}.grade-S{background:#7c651a;color:#ffe071}.grade-A{background:#6a2f2f;color:#ff9898}.grade-B{background:#265737;color:#8fe9a9}.grade-C{background:#254b75;color:#8fc8ff}.grade-D{background:#3d4450;color:#c4ccd6}.grade-E{background:#2a2f37;color:#8e98a7}.grade-F{background:#171b20;color:#666f7c}.bet-list{display:grid;gap:7px}.bet{font-size:12px;background:#0e1218;border:1px solid #242b35;border-radius:9px;padding:10px}.summary{font-size:12px;color:#bcc6d0;line-height:1.75}.legacy-note{font-size:11px;color:var(--gold);margin-top:8px}.empty{padding:24px;text-align:center;color:var(--muted);font-size:12px}
.result-card{width:100%;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:13px;color:#fff}.result-top{display:flex;justify-content:space-between;gap:10px}.result-finishes{display:flex;gap:7px;margin-top:9px;flex-wrap:wrap}.finish-pill{border:1px solid #27303c;background:#11161d;border-radius:9px;padding:7px 9px;font-size:12px;font-weight:800}.result-detail{margin-top:15px;border:1px solid var(--line);background:var(--panel);border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}.result-runner{display:grid;grid-template-columns:38px 44px 1fr auto;gap:9px;align-items:center;background:#0f1319;border:1px solid #1f2630;padding:10px;border-radius:12px}.finish-no{font-size:18px;font-weight:900;text-align:center}.finish-no span{display:block;font-size:8px;color:var(--muted);font-weight:800}.pre-rank{font-size:10px;color:#aeb8c5;text-align:right;white-space:nowrap}.pre-rank strong{display:block;font-size:13px;color:#fff}.eye-tag{display:inline-flex;margin-top:5px;border:1px solid rgba(255,207,74,.35);color:var(--gold);border-radius:999px;padding:2px 6px;font-size:8px;font-weight:900;letter-spacing:.08em}.review-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.review-card{border:1px solid var(--line);background:#0f1319;border-radius:12px;padding:12px}.review-title{font-size:10px;font-weight:900;letter-spacing:.08em;margin-bottom:7px}.review-title.hit{color:var(--accent2)}.review-title.miss{color:var(--danger)}.review-text{font-size:11px;color:#c2cbd5;line-height:1.65}.review-pending{color:var(--muted)}.result-legend{font-size:10px;color:var(--muted);line-height:1.6;margin-top:8px}.result-empty-note{font-size:11px;color:var(--muted);padding:8px 0}.result-mark{font-size:11px;color:var(--muted);margin-top:3px}
footer{display:flex;justify-content:space-between;gap:10px;color:#4f5967;font-size:9px;padding:20px 2px 0;border-top:1px solid #151a20;margin-top:20px}
@media (max-width:560px){.app-shell{padding:14px 10px 32px}h1{font-size:25px}.brain-badge{font-size:10px}.toolbar{align-items:stretch;flex-direction:column}.segmented{align-self:flex-start}.runner{grid-template-columns:44px 1fr auto}.eye-main{grid-template-columns:44px 1fr auto}.helmet{width:39px;height:32px}.update-card{padding:11px 12px}.result-runner{grid-template-columns:30px 40px 1fr auto}.review-grid{grid-template-columns:1fr}}

</style>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <div class="eyebrow">LAB HUB 2.0</div>
        <h1>馬券に、理由を。</h1>
      </div>
    </header>

    <div class="update-card" aria-label="更新情報">
      <div class="update-head"><span class="update-label">UPDATE</span><span class="update-date">2026.9.24</span></div>
      <div class="update-text">全頭LAB RANKの表示を見直し、馬番・ランク・人気・オッズ・評価コメントを見やすくしました。LAB🧪EYEを最上部に配置し、推奨買い目へすぐ移動できるボタンも追加しました。</div>
    </div>

    <nav class="tabs" aria-label="メインナビゲーション">
      <button class="tab active" data-tab="today">TODAY</button>
      <button class="tab" data-tab="result">RESULT</button>
    </nav>

    <main>
      <section id="today" class="panel active">
        <div class="toolbar">
          <label class="field-label">DATE<input id="dateInput" type="date" /></label>
          <div class="segmented" role="group" aria-label="競馬区分">
            <button class="seg active" data-circuit="ALL">ALL</button>
            <button class="seg" data-circuit="LOCAL">地方</button>
            <button class="seg" data-circuit="JRA">中央</button>
          </div>
        </div>

        <div id="status" class="status-card">予想データを読み込み中…</div>
        <div id="raceList" class="race-list"></div>
        <article id="predictionDetail" class="prediction-detail hidden"></article>
      </section>

      <section id="result" class="panel">
        <div class="toolbar">
          <label class="field-label">DATE<input id="resultDateInput" type="date" /></label>
        </div>
        <div id="resultStatus" class="status-card">結果を読み込みます。</div>
        <div id="resultList" class="race-list"></div>
        <article id="resultDetail" class="result-detail hidden"></article>
      </section>
    </main>

    <footer>
      <span>BAKEN LAB｜馬券ラボ</span>
      <span>Pre-race predictions are frozen before results.</span>
    </footer>
  </div>

  <script>
const API = 'https://qjlvsndiqjfsfjinilig.supabase.co/functions/v1/hub2-api';

const state = { predictions: [], circuit: 'ALL' };
const $ = (id) => document.getElementById(id);

function localIsoDate() {
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}

function esc(value='') {
  return String(value).replace(/[&<>'"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]));
}

function fmtTime(value) {
  if (!value) return '時刻未登録';
  try { return new Intl.DateTimeFormat('ja-JP',{hour:'2-digit',minute:'2-digit'}).format(new Date(value)); }
  catch { return '時刻未登録'; }
}

async function api(params) {
  const url = new URL(API);
  Object.entries(params).forEach(([k,v]) => url.searchParams.set(k,v));
  const res = await fetch(url, { cache:'no-store' });
  const data = await res.json().catch(()=>({ok:false,error:'invalid_json'}));
  if (!res.ok || !data.ok) throw new Error(data.error || `HTTP ${res.status}`);
  return data;
}

function renderRaceList() {
  const rows = state.predictions.filter(p => state.circuit === 'ALL' || p.circuit === state.circuit);
  if (!rows.length) {
    $('raceList').innerHTML = '<div class="empty">この日の固定済み予想はまだありません。</div>';
    return;
  }
  $('raceList').innerHTML = rows.map(p => `
    <button class="race-card" data-race="${esc(p.id)}">
      <div class="race-line">
        <div>
          <div class="race-id"><span class="circuit-chip">${esc(p.circuit)}</span><span class="race-no">${esc(p.track)} ${p.race_no}R</span></div>
          <div class="race-name">${esc(p.race_name || 'レース名未登録')}</div>
        </div>
        <div class="race-meta"><div class="frozen">● FIXED</div><div>${fmtTime(p.predicted_at)}</div></div>
      </div>
    </button>`).join('');

  document.querySelectorAll('[data-race]').forEach(btn => btn.addEventListener('click', () => {
    const p = state.predictions.find(x => x.id === btn.dataset.race);
    if (p) renderPrediction(p);
  }));
}

function horseHelmetClass(no) {
  const n = Number(no);
  if (!Number.isFinite(n) || n <= 0) return 'helmet-n1 light';
  const slot = ((n - 1) % 8) + 1;
  return `helmet-n${slot} ${[1,5].includes(slot) ? 'light' : 'dark'}`;
}

function gradeClass(grade) {
  const g = String(grade || '').toUpperCase();
  return ['S','A','B','C','D','E','F'].includes(g) ? `grade-${g}` : 'grade-D';
}

function marketHtml(x) {
  const odds = x?.win_odds ?? x?.odds ?? x?.market?.win_odds ?? x?.market?.odds ?? null;
  const pop = x?.popularity ?? x?.market?.popularity ?? null;
  const oddsText = odds !== null && odds !== undefined && odds !== '' ? `${esc(odds)}倍` : '—';
  const popText = pop !== null && pop !== undefined && pop !== '' ? `${esc(pop)}人気` : '—人気';
  return `<div class="market"><strong>${oddsText}</strong> / ${popText}</div>`;
}

function runnerReason(x) {
  return x?.comment || x?.reason || x?.short_reason || '評価コメント未登録';
}

function renderPrediction(p) {
  const payload = p.payload || {};
  const runners = Array.isArray(payload.runners) ? payload.runners : [];
  const eye = payload.eye || null;
  const bets = Array.isArray(payload.bets) ? payload.bets : [];

  const eyeRunner = eye && runners.length
    ? runners.find(r => Number(r.horse_no) === Number(eye.horse_no))
    : null;
  const eyeDisplay = eye ? { ...(eyeRunner || {}), ...eye } : null;

  const eyeHtml = eyeDisplay ? `
    <div class="eye-card">
      <div class="eye-label">LAB 🧪 EYE</div>
      <div class="eye-main">
        <div class="helmet ${horseHelmetClass(eyeDisplay.horse_no)}">${esc(eyeDisplay.horse_no || '?')}</div>
        <div><div class="eye-name">${esc(eyeDisplay.horse_name || '')}</div>${marketHtml(eyeDisplay)}</div>
        <div class="grade ${gradeClass(eyeDisplay.grade)}">${esc(eyeDisplay.grade || '-')}</div>
      </div>
      <div class="eye-reason">${esc(runnerReason(eyeDisplay))}</div>
    </div>` : '<div class="empty">LAB EYEは未登録です。</div>';

  // IMPORTANT: saved payload order is authoritative. The HUB does not sort or re-rank.
  const runnerHtml = runners.length ? runners.map(r => `
    <div class="runner">
      <div class="helmet ${horseHelmetClass(r.horse_no)}">${esc(r.horse_no || '?')}</div>
      <div class="runner-center">
        <div class="runner-line"><div class="runner-name">${esc(r.horse_name || '')}</div></div>
        <div class="runner-comment">${esc(runnerReason(r))}</div>
      </div>
      <div class="runner-right">
        <div class="grade ${gradeClass(r.grade)}">${esc(r.grade || '-')}</div>
        ${marketHtml(r)}
      </div>
    </div>`).join('') : '<div class="empty">この旧保存データは全頭評価保存前の予想です。</div>';

  const betHtml = bets.length ? bets.map(b => `<div class="bet">${esc(typeof b === 'string' ? b : (b.text || b.label || JSON.stringify(b)))}</div>`).join('') : '<div class="empty">買い目は未登録です。</div>';

  $('predictionDetail').innerHTML = `
    <div class="detail-head"><div class="detail-kicker">${esc(p.circuit)} / PRE-RACE</div><div class="detail-title">${esc(p.track)} ${p.race_no}R　${esc(p.race_name || '')}</div><div class="detail-sub">予想固定 ${fmtTime(p.frozen_at)}</div><a class="jump-bet" href="#betPlan">推奨買い目を見る ↓</a></div>
    <div class="section"><div class="section-title">LAB 🧪 EYE</div>${eyeHtml}</div>
    <div class="section"><div class="section-title">ALL RUNNERS / LAB RANK</div><div class="runner-table">${runnerHtml}</div>${p.legacy ? '<div class="legacy-note">※これは2.0導入前の保存データなので、全頭ランク・人気・オッズなど一部情報は未保存です。</div>' : ''}</div>
    <div class="section" id="betPlan"><div class="section-title">推奨買い目</div><div class="bet-list">${betHtml}</div></div>
    <div class="section"><div class="section-title">JUDGEMENT</div><div class="summary">${esc(payload.summary || '固定済み予想をそのまま表示しています。')}</div></div>`;
  $('predictionDetail').classList.remove('hidden');
  $('predictionDetail').scrollIntoView({behavior:'smooth',block:'start'});
}

async function loadPredictions() {
  const date = $('dateInput').value;
  $('status').textContent = '固定済み予想を読み込み中…';
  $('predictionDetail').classList.add('hidden');
  try {
    const data = await api({action:'list',date});
    state.predictions = data.predictions || [];
    $('status').innerHTML = `<strong>${state.predictions.length}レース</strong>｜固定済み予想`;
    renderRaceList();
  } catch (e) {
    $('status').textContent = `読み込みエラー：${e.message}`;
    $('raceList').innerHTML = '';
  }
}

function normalizeFinishers(result) {
  const candidates = [result?.finishers, result?.runners, result?.placements, result?.results, result?.top3];
  const arr = candidates.find(Array.isArray) || [];
  return arr.map((x,i) => ({
    finish: Number(x?.finish ?? x?.position ?? x?.actual_finish ?? x?.rank ?? (i+1)),
    horse_no: x?.horse_no ?? x?.number ?? x?.no ?? '',
    horse_name: x?.horse_name ?? x?.name ?? '',
    ...x
  })).filter(x => Number.isFinite(x.finish) && x.finish > 0).sort((a,b)=>a.finish-b.finish);
}

function predictionRunnerFor(finisher, prediction) {
  const runners = Array.isArray(prediction?.payload?.runners) ? prediction.payload.runners : [];
  let match = runners.find(r => Number(r.horse_no) === Number(finisher.horse_no));
  if (!match && finisher.horse_name) match = runners.find(r => String(r.horse_name) === String(finisher.horse_name));
  return match || null;
}

function isEyeRunner(runner, prediction) {
  const eye = prediction?.payload?.eye;
  if (!runner || !eye) return false;
  return Number(runner.horse_no) === Number(eye.horse_no) || (runner.horse_name && runner.horse_name === eye.horse_name);
}

function storedReview(result) {
  const a = result?.analysis || result?.review || result?.post_race_review || {};
  return {
    hit: a.hit_reason || a.picked_reason || a.caught_reason || result?.hit_reason || result?.picked_reason || '',
    miss: a.miss_reason || a.missed_reason || a.not_caught_reason || result?.miss_reason || result?.missed_reason || ''
  };
}

function factualFallbackReview(finishers, prediction) {
  if (!prediction) {
    return {
      hit: 'このレースの発走前固定予想が見つからないため、事前評価との照合はできません。',
      miss: '事後検証コメントは未登録です。'
    };
  }
  const top3 = finishers.filter(x => x.finish <= 3);
  const caught = [];
  const missed = [];
  top3.forEach(f => {
    const pr = predictionRunnerFor(f, prediction);
    if (!pr) return missed.push(`${f.horse_no || ''}${f.horse_name ? ' '+f.horse_name : ''}`.trim());
    const rank = Number(pr.rank);
    if ((Number.isFinite(rank) && rank <= 5) || isEyeRunner(pr,prediction)) caught.push(`${f.horse_no || ''}${f.horse_name ? ' '+f.horse_name : ''}`.trim());
    else missed.push(`${f.horse_no || ''}${f.horse_name ? ' '+f.horse_name : ''}`.trim());
  });
  return {
    hit: caught.length ? `事前の上位5頭またはLAB EYEで ${caught.join('、')} を拾えていました。具体的な事前根拠は各馬コメントを参照。` : '3着以内を上位5頭・LAB EYEで拾えていません。事後検証コメントは未登録です。',
    miss: missed.length ? `${missed.join('、')} は事前の上位5頭・LAB EYE外でした。なぜ評価を上げ切れなかったかは事後検証コメント登録後に表示します。` : '3着以内はすべて上位5頭またはLAB EYEで拾えていました。'
  };
}

function renderResultDetail(row, prediction) {
  const result = row.result || {};
  const finishers = normalizeFinishers(result);
  const review = storedReview(result);
  const fallback = factualFallbackReview(finishers, prediction);
  const hitText = review.hit || fallback.hit;
  const missText = review.miss || fallback.miss;
  const reviewPending = !review.hit && !review.miss;

  const rowsHtml = finishers.length ? finishers.map(f => {
    const pr = predictionRunnerFor(f, prediction);
    const eye = isEyeRunner(pr,prediction);
    const rank = pr?.rank ?? '—';
    const grade = pr?.grade ?? '-';
    const comment = pr ? runnerReason(pr) : '事前評価データなし';
    const mark = pr?.mark ? ` / ${esc(pr.mark)}` : '';
    return `<div class="result-runner">
      <div class="finish-no">${esc(f.finish)}<span>着</span></div>
      <div class="helmet ${horseHelmetClass(f.horse_no)}">${esc(f.horse_no || '?')}</div>
      <div class="runner-center">
        <div class="runner-name">${esc(f.horse_name || '')}</div>
        <div class="runner-comment">${esc(comment)}</div>
        ${eye ? '<span class="eye-tag">LAB 🧪 EYE</span>' : ''}
      </div>
      <div class="runner-right">
        <div class="grade ${gradeClass(grade)}">${esc(grade)}</div>
        <div class="pre-rank"><strong>LAB ${esc(rank)}位${mark}</strong>事前評価</div>
      </div>
    </div>`;
  }).join('') : '<div class="empty">実着順データはまだ登録されていません。</div>';

  $('resultDetail').innerHTML = `
    <div class="detail-head">
      <div class="detail-kicker">${esc(row.circuit || prediction?.circuit || '')} / RESULT</div>
      <div class="detail-title">${esc(row.track)} ${row.race_no}R　${esc(row.race_name || prediction?.race_name || '')}</div>
      <div class="detail-sub">実着順 × 発走前固定LAB評価</div>
    </div>
    <div class="section">
      <div class="section-title">RESULT × PRE-RACE LAB RANK</div>
      <div class="runner-table">${rowsHtml}</div>
      <div class="result-legend">実着順の横に、発走前に固定したLAB順位・S〜F・評価コメントをそのまま表示します。結果に合わせた事前評価の書き換えはしません。</div>
    </div>
    <div class="section">
      <div class="section-title">POST-RACE REVIEW</div>
      <div class="review-grid">
        <div class="review-card"><div class="review-title hit">拾えた理由</div><div class="review-text ${reviewPending ? 'review-pending':''}">${esc(hitText)}</div></div>
        <div class="review-card"><div class="review-title miss">拾えなかった理由</div><div class="review-text ${reviewPending ? 'review-pending':''}">${esc(missText)}</div></div>
      </div>
      ${reviewPending ? '<div class="result-empty-note">※まだ事後分析が保存されていない場合は、事実ベースの照合だけを表示しています。理由を後付けで作ってはいません。</div>' : ''}
    </div>`;
  $('resultDetail').classList.remove('hidden');
  $('resultDetail').scrollIntoView({behavior:'smooth',block:'start'});
}

async function loadResults() {
  const date = $('resultDateInput').value;
  $('resultStatus').textContent = '結果を読み込み中…';
  $('resultDetail').classList.add('hidden');
  try {
    const [resultData, predictionData] = await Promise.all([
      api({action:'results',date}),
      api({action:'list',date}).catch(()=>({predictions:[]}))
    ]);
    const rows = resultData.results || [];
    const predictions = predictionData.predictions || [];
    $('resultStatus').textContent = `${rows.length}レース｜実着順 × 発走前固定LAB評価`;
    $('resultList').innerHTML = rows.length ? rows.map((r,i) => {
      const fin = normalizeFinishers(r.result || {}).filter(x=>x.finish<=3);
      return `<button class="result-card" data-result-index="${i}"><div class="result-top"><div><strong>${esc(r.track)} ${r.race_no}R</strong><div class="race-name">${esc(r.race_name || '')}</div></div><span class="circuit-chip">${esc(r.circuit || '')}</span></div><div class="result-finishes">${fin.map(x=>`<span class="finish-pill">${esc(x.finish)}着 ${esc(x.horse_no ?? '')}${x.horse_name ? ` ${esc(x.horse_name)}`:''}</span>`).join('')}</div></button>`;
    }).join('') : '<div class="empty">この日の結果はまだ登録されていません。</div>';

    document.querySelectorAll('[data-result-index]').forEach(btn => btn.addEventListener('click',()=>{
      const r = rows[Number(btn.dataset.resultIndex)];
      if (!r) return;
      const p = predictions.find(x => x.track === r.track && Number(x.race_no) === Number(r.race_no)) || null;
      renderResultDetail(r,p);
    }));
  } catch(e) {
    $('resultStatus').textContent = `読み込みエラー：${e.message}`;
    $('resultList').innerHTML = '';
  }
}

function initTabs() {
  document.querySelectorAll('.tab').forEach(tab => tab.addEventListener('click',()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===tab));
    document.querySelectorAll('.panel').forEach(x=>x.classList.toggle('active',x.id===tab.dataset.tab));
    if (tab.dataset.tab==='result') loadResults();
  }));
}

function initCircuit() {
  document.querySelectorAll('.seg').forEach(seg => seg.addEventListener('click',()=>{
    state.circuit = seg.dataset.circuit;
    document.querySelectorAll('.seg').forEach(x=>x.classList.toggle('active',x===seg));
    renderRaceList();
  }));
}

const today = localIsoDate();
$('dateInput').value = today;
$('resultDateInput').value = today;
$('dateInput').addEventListener('change',loadPredictions);
$('resultDateInput').addEventListener('change',loadResults);
initTabs();
initCircuit();
loadPredictions();

</script>
</body>
</html>

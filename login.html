<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#090b0f">
<title>LAB HUB｜閲覧パスワード</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 0%,#172f36 0%,#090b0f 60%);font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;color:#f6f7f8;padding:20px}
main{width:min(100%,440px);background:#111820;border:1px solid #344550;border-radius:22px;padding:30px 25px;box-shadow:0 16px 70px #0008}
.kicker{color:#86d7c8;font-size:12px;letter-spacing:.16em;font-weight:750}.title{font-size:31px;letter-spacing:.03em;margin:12px 0 6px}.copy{color:#b9c4cb;font-size:14px;line-height:1.75;margin:6px 0 28px}label{display:block;margin:0 0 10px;font-size:14px;font-weight:700}input[type=password]{width:100%;padding:16px;background:#080c11;color:#fff;border:1px solid #5a6770;border-radius:12px;font-size:17px;outline-offset:3px}button{margin-top:18px;width:100%;padding:16px 20px;border:0;border-radius:12px;background:#87dbcb;color:#09221b;font-size:16px;font-weight:800;cursor:pointer}
.err{color:#ffaaa8;margin:12px 0 0;font-size:13px;display:none}footer{margin-top:22px;color:#85929b;text-align:center;font-size:12px}
</style></head><body><main>
<div class="kicker">BAKEN LAB ｜ FREE TEST</div><h1 class="title">LAB HUB 🔐</h1>
<p class="copy">馬券に、理由を。<br>現在は無料テスト公開中です。閲覧パスワードはBAKEN LABのXアカウントへお問い合わせください。</p>
<form action="/api/lab-login" method="post" autocomplete="off">
<label for="password">閲覧パスワード</label><input id="password" type="password" name="password" required maxlength="256" autocomplete="current-password" autofocus>
<input id="next" type="hidden" name="next" value="/">
<button type="submit">LAB HUBに入る →</button>
<p class="err" id="error" role="alert">パスワードが違います。もう一度お試しください。</p>
</form><footer>BAKEN LAB｜馬券ラボ</footer>
</main><script>
const search=new URLSearchParams(location.search),next=search.get('next');
if(next&&next.startsWith('/')&&!next.startsWith('//')&&!next.startsWith('/api/')&&!next.startsWith('/login.html')&&!next.includes('\\'))document.getElementById('next').value=next;
if(search.get('error')==='1')document.getElementById('error').style.display='block';
</script></body></html>
